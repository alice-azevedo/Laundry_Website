<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Controle Lavanderia</title>
</head>

<body>
  <nav>
    <button id="botao-sair">Sair</button>
    <a href="#a-receber">Serviços</a>
    <a href="#clientes">Clientes</a>
    <a href="#relatorio">Relatório</a>
    <a href="#nota-fiscal">Nota Fiscal</a>
  </nav>

  <div id="container-sessao">
    <div class="sessao-esquerda">
      <h3>A receber</h3>
      <div id="a-receber"></div>
      <div class="interno-esquerdo">
        
      </div>
      <button id="botao-alterar" class="botao-criar" class="botao-esquerdo">Alterar</button>
    </div>
    <div class="sessao-direita">
      <section class="sessoes">
        <h3>Serviços</h3>
        <div class="interno-direito">
        
        </div>
        <div id="servicos"></div>
        <button id="botao-servicos" class="botao-criar" class="botao-esquerdo">Novo Serviço</button>
      </section>
      <section class="sessoes">
        <h3>Clientes</h3>
        <div id="clientes"></div>
        <div class="interno-direito">
        
        </div>
        <button id="botao-clientes" class="botao-criar" class="botao-esquerdo">Novo Cliente</button>
      </section>
      <section class="sessoes">
        <h3>Relatório</h3>
        <div id="relatorio"></div>
        <div class="interno-direito">
        
        </div>
        <button id="botao-realtorio" class="botao-criar" class="botao-esquerdo">Novo Relatório</button>
      </section>
      <section class="sessoes">
        <h3>Nota Fiscal</h3>
        <div id="nota-fiscal" ></div>
        <div class="interno-direito">
        
        </div>
        <button class="botao-criar" class="botao-esquerdo">Imprimir</button>
      </section>
    </div>
  </div>

  <script src="mainScript.js"></script>
</body>

</html>
