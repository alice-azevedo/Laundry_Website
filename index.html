<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Controle Lavanderia</title>
</head>

<body>
  <nav>
    <ul class="js-tabMenu">
      <li>Serviços</li>
        <li>Clientes</li>
        <li>Relatório</li>
        <li>Nota Fiscal</li>
    </ul>
    
  </nav>

  <div id="container-sessao">
    <div class="sessao-esquerda">
      <h3>A receber</h3>
      <button class="botao-criar" class="botao-esquerdo">Alterar</button>
    </div>
    <div class="js-tabConteudo sessao-direita">
      <section class="sessoes">
        <h3>Serviços</h3>
        <button class="botao-criar" class="botao-esquerdo">Novo Serviço</button>
      </section>
      <section class="sessoes">
        <h3>Clientes</h3>
        <button class="botao-criar" class="botao-esquerdo">Novo Cliente</button>
      </section>
      <section class="sessoes">
        <h3>Relatório</h3>
        <button class="botao-criar" class="botao-esquerdo">Novo Relatório</button>
      </section>
      <section class="sessoes">
        <h3>Nota Fiscal</h3>
        <button class="botao-criar" class="botao-esquerdo">Imprimir</button>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
